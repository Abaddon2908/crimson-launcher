name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          name: Crimson Launcher ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/CrimsonLauncher-Setup-*.exe
            dist/CrimsonLauncher-Portable-*.exe
