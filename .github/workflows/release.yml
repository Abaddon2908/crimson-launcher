name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: v
        shell: bash
        run: echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - run: npx electron-builder --win --x64 --publish never
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.v.outputs.version }}
          name: NLauncher ${{ github.ref_type == 'tag' && github.ref_name || steps.v.outputs.version }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/NLauncher-Setup-*.exe
            dist/NLauncher-Portable-*.exe
